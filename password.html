{% extends 'base.html' %}{% block title %}Change password{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:30px auto"><h2 style="margin-top:0">Change password</h2>
 <form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
  <label>Old password</label><input type="password" name="old" style="width:100%" required>
  <label>New password (min 6 characters)</label><input type="password" name="new" style="width:100%" required>
  <label>Repeat new password</label><input type="password" name="again" style="width:100%" required>
  <p><button class="btn">Save</button></p></form></div>
{% endblock %}
